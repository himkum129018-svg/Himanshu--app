name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Hindi voice model
        run: |
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q vosk-model-small-hi-0.22.zip
          mkdir -p app/src/main/assets
          mv vosk-model-small-hi-0.22 app/src/main/assets/model
          uuidgen > app/src/main/assets/model/uuid
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Himanshu app ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
